databaseChangeLog:
  - changeSet:
      id: enable-uuid
      author: MigalNV
      context: "!test"
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
  - changeSet:
      id: 01-create-wish-table
      author: MigalNV
      changes:
        - createTable:
            tableName: wish
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: item
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: number_of_items
                  type: INT
                  defaultValue: 0
                  constraints:
                    nullable: false
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - createTable:
            tableName: user_wish
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: wish_id
                  type: UUID
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_wish
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_userwish_user
        - addForeignKeyConstraint:
            baseTableName: user_wish
            baseColumnNames: wish_id
            referencedTableName: wish
            referencedColumnNames: id
            constraintName: fk_userwish_wish

  - changeSet:
      id: 02-insert-wish-data
      author: MigalNV
      changes:
        - insert:
            tableName: wish
            columns:
              - column: { name: id, valueComputed: "uuid_generate_v4()" }
              - column: { name: item, value: "Funko Pop" }
              - column: { name: number_of_items, value: "2" }
        - insert:
            tableName: wish
            columns:
              - column: { name: id, valueComputed: "uuid_generate_v4()" }
              - column: { name: item, value: "Сертификат на тату у @evatattt" }
              - column: { name: number_of_items, value: "2" }
        - insert:
            tableName: wish
            columns:
              - column: { name: id, valueComputed: "uuid_generate_v4()" }
              - column: { name: item, value: "Деньги :)" }
              - column: { name: number_of_items, value: "2" }
        - insert:
            tableName: wish
            columns:
              - column: { name: id, valueComputed: "uuid_generate_v4()" }
              - column: { name: item, value: "Сертификат OZON" }
              - column: { name: number_of_items, value: "2" }
